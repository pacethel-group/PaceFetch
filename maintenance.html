<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaceFetch - Under Maintenance</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:50px 30px;max-width:500px;width:100%}
.icon{font-size:70px;margin-bottom:20px}
h1{font-size:28px;margin-bottom:12px;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#9ca3af;line-height:1.6;margin-bottom:8px}
.time{margin-top:25px;padding:12px;background:rgba(168,85,247,0.1);border-radius:12px;color:#a855f7;font-size:14px}
.btn{margin-top:25px;display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#a855f7,#ec4899);color:white;text-decoration:none;border-radius:50px;font-weight:600}
.footer{margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1)}
.footer .built{color:#fff;font-weight:600;font-size:13px}
.footer .update{color:#6b7280;font-size:12px;margin-top:6px}
.dot{width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="card">
<div class="icon">🔧</div>
<h1>Under Maintenance</h1>
<p>PaceFetch is currently undergoing scheduled maintenance.</p>
<p>We're making things faster and better for you.</p>
<div class="time">⏱️ We'll be back shortly - usually under 30 mins</div>
<a href="/" class="btn">Refresh Page</a>
<div class="footer">
<div class="built">Built by Pacethel</div>
<div class="update"><span class="dot"></span> System Update • v1.1</div>
</div>
</div>
</body>
</html>
